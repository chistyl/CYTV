name: CYTV R163 Android Build

on:
  push:
    branches:
      - feature/dynamic-wallpaper-themes-r163
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r163-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R163-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
