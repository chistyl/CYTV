name: CYTV R170 Android Build

on:
  push:
    branches:
      - fix/dynamic-wallpaper-source-fallback-r170
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r170-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate dynamic wallpaper catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/src/main/assets/dynamic_wallpaper_themes.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          videos = catalog.get("videos", [])
          themes = catalog.get("themes", [])
          video_ids = [item.get("id") for item in videos]
          assert len(themes) == 9, f"Expected 9 curated Aerial themes, found {len(themes)}"
          assert len(video_ids) == len(set(video_ids)), "Duplicate video IDs found"
          known_ids = set(video_ids)
          for theme in themes:
              ids = theme.get("videoIds", [])
              assert ids, f"Theme has no videos: {theme.get('id')}"
              missing = set(ids) - known_ids
              assert not missing, f"Unknown video IDs in {theme.get('id')}: {sorted(missing)}"
          for video in videos:
              assert video.get("streamUrl", "").startswith("https://"), f"Invalid stream URL: {video.get('id')}"
          expected = {
              "ice-glacier": 9, "mountain-forest": 14, "canyon-wilderness": 18,
              "aurora-night": 2, "earth-at-night": 2, "global-flight": 17,
              "coral-reef": 2, "ocean-life": 15, "kelp-forest": 2
          }
          actual = {theme["id"]: len(theme["videoIds"]) for theme in themes}
          assert actual == expected, f"Unexpected curated theme distribution: {actual}"
          video_by_id = {item["id"]: item for item in videos}
          for theme in themes:
              for video_id in theme["videoIds"]:
                  source_category = video_by_id[video_id].get("sourceCategory")
                  assert source_category != "cities", f"City video assigned to theme {theme['id']}"
                  expected_category = {
                      "ice-glacier": "landscapes", "mountain-forest": "landscapes", "canyon-wilderness": "landscapes",
                      "aurora-night": "space", "earth-at-night": "space", "global-flight": "space",
                      "coral-reef": "underwater", "ocean-life": "underwater", "kelp-forest": "underwater"
                  }[theme["id"]]
                  assert source_category == expected_category, f"Cross-category assignment: {video_id}"
          assert len(videos) == 114, f"Expected 114 source videos, found {len(videos)}"
          assert all(item.get("sourceCategory") != "cities" or not item.get("themeIds") for item in videos), "City videos must not appear in themes"
          print(f"Validated {len(videos)} source videos, 9 curated non-city themes: {actual}")
          PY

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Package complete source
        working-directory: .
        run: |
          zip -r CYTV-R170-source.zip . \
            -x '.git/*' '*/.gradle/*' '*/build/*' '*/.idea/*' \
               '*/local.properties' '*.iml'

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R170-source
          path: CYTV-R170-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R170-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
