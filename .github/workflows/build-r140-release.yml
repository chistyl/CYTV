name: Build CYTV-R140 Ethernet DNS Fix R3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R3 source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Run unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build release APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/*.apk dist/CYTV-R140_R3-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R140-R3-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
