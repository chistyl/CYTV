name: Validate launcher icon and banner R2

on:
  push:
    branches:
      - fix/launcher-icon-banner-activity-r2-b3a294e
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher-icon-banner-r2.yml'
  pull_request:
    branches:
      - experiment/remove-toshiba-r1-vpn-guard
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher-icon-banner-r2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generate density-specific launcher icons from supplied artwork
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("launcher/app/src/main/res/drawable-nodpi/ic_launcher_art.png")
          image = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = Path("launcher/app/src/main/res") / folder / "ic_launcher.png"
              target.parent.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(target, format="PNG", optimize=True)
              check = Image.open(target)
              assert check.size == (size, size), (target, check.size)
              assert check.getbbox() is not None, target
              print(f"{target}: {check.size}, RGBA={check.mode}")
          PY
      - name: Generate Android TV xhdpi banner at the documented 320x180 size
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("launcher/app/src/main/res/drawable-nodpi/banner.png")
          target = Path("launcher/app/src/main/res/drawable-xhdpi/banner.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          image = Image.open(src).convert("RGBA")
          # Keep the full 16:9 artwork; resize only, never crop or stretch.
          assert abs(image.width / image.height - 16 / 9) < 0.002
          image.resize((320, 180), Image.Resampling.LANCZOS).save(target, format="PNG", optimize=True)
          check = Image.open(target)
          assert check.size == (320, 180), check.size
          print(f"{target}: {check.size}, RGBA={check.mode}")
          PY
      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: cytv-launcher-icon-banner-r3-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
