name: Build CYTV Settings Menu Uniform Height

on:
  push:
    branches:
      - fix/settings-menu-uniform-button-height-630117b
    paths:
      - 'launcher/**'
      - '.github/workflows/build-settings-menu-height.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run launcher unit tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Settings-Menu-Uniform-Height-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source archive
        run: |
          zip -qr CYTV-Settings-Menu-Uniform-Height-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-Settings-Menu-Uniform-Height-source.zip'

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Settings-Menu-Uniform-Height-Source
          path: CYTV-Settings-Menu-Uniform-Height-source.zip
          if-no-files-found: error
          retention-days: 30
