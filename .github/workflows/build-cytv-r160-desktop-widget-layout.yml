name: CYTV R160 Desktop Widget Layout Build
on:
  push:
    branches:
      - feature/desktop-widget-layout-r160
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r160-desktop-widget-layout.yml'
      - 'docs/specs/desktop-widget-layout-r160.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feature/desktop-widgets-r159
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r160-desktop-widget-layout.yml'
      - 'docs/specs/desktop-widget-layout-r160.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R160-debug.apk
          zip -r release/CYTV-R160-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R160-APK-and-Source
          path: |
            release/CYTV-R160-debug.apk
            release/CYTV-R160-Source.zip
          if-no-files-found: error
