name: CYTV R118 Input Source Always Visible Test
# R118 test CI: keep the top-right Inputs button visible at all times for remote-control focus testing.

on:
  push:
    branches:
      - test/input-source-always-visible-r118
  pull_request:
    branches:
      - fix/input-source-dpad-left-r117
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r118-input-source-visible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R118 test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R118-input-source-test.apk
          zip -r release/CYTV-R118-input-source-test-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R118-Input-Source-Test
          path: |
            release/CYTV-R118-input-source-test.apk
            release/CYTV-R118-input-source-test-source.zip
          if-no-files-found: error
          retention-days: 30
