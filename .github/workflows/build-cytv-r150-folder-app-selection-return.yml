name: CYTV R150 Folder App Selection Return Build

on:
  push:
    branches:
      - fix/folder-app-selection-return-list-r150
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r150-folder-app-selection-return.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feature/qr-wallpaper-gallery-refresh-r149
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r150-folder-app-selection-return.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R150-debug.apk
          zip -r release/CYTV-R150-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R150-APK-and-Source
          path: |
            release/CYTV-R150-debug.apk
            release/CYTV-R150-Source.zip
          if-no-files-found: error
