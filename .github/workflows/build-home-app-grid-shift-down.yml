name: Build CYTV Home App Grid Shift Down

on:
  push:
    branches:
      - fix/home-app-grid-shift-down-r1
    paths:
      - 'launcher/**'
      - '.github/workflows/build-home-app-grid-shift-down.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Report APK size and checksum
        shell: bash
        run: |
          APK="$(find launcher/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          stat -c 'APK_SIZE_BYTES=%s' "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Home-App-Grid-Shift-Down-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source archive
        run: |
          zip -qr CYTV-Home-App-Grid-Shift-Down-Complete-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-Home-App-Grid-Shift-Down-Complete-Source.zip'

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Home-App-Grid-Shift-Down-Complete-Source
          path: CYTV-Home-App-Grid-Shift-Down-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
