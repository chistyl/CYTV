name: Build CYTV R57 Wallpaper Fullscreen YouTube Style
on:
  push:
    branches:
      - fix/wallpaper-fullscreen-youtube-style-r57
    paths:
      - 'launcher/**'
      - '.github/workflows/build-wallpaper-fullscreen-youtube-style-r57.yml'
  pull_request:
    branches:
      - fix/interface-layout-height-10pct-r55
    paths:
      - 'launcher/**'
      - '.github/workflows/build-wallpaper-fullscreen-youtube-style-r57.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R57 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R57-Wallpaper-Fullscreen-YouTube-Style-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete source archive
        run: |
          zip -qr CYTV-R57-Wallpaper-Fullscreen-YouTube-Style-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-R57-Wallpaper-Fullscreen-YouTube-Style-Source.zip'
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R57-Wallpaper-Fullscreen-YouTube-Style-Complete-Source
          path: CYTV-R57-Wallpaper-Fullscreen-YouTube-Style-Source.zip
          if-no-files-found: error
          retention-days: 30
