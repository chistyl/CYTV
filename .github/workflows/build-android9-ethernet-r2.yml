name: Build CYTV Android 9 Ethernet R2

on:
  push:
    branches:
      - fix/android9-ethernet-vpn-r2-5df06d5
    paths:
      - 'launcher/**'
      - '.github/workflows/build-android9-ethernet-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R2 repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Android9-Ethernet-R2-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source archive
        run: |
          zip -qr CYTV-Android9-Ethernet-R2-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-Android9-Ethernet-R2-source.zip'

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Android9-Ethernet-R2-Complete-Source
          path: CYTV-Android9-Ethernet-R2-source.zip
          if-no-files-found: error
          retention-days: 30
