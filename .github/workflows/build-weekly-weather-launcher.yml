name: Build CYTV Weekly Weather Launcher

on:
  push:
    branches:
      - fix/weather-city-search-7day
      - fix/folder-grid-fixed-four-columns
      - fix/folder-app-assignment-sync
      - fix/folder-dialog-dpad-from-baseline
      - feature/weather-icons-emotn-inspired-67c7d53
      - feature/unified-settings-ui-7c7345f
      - fix/folder-app-menu-window-anchor-a692da0
      - fix/weather-city-heading-visible-506e839
      - fix/icon-appearance-preview-match-desktop-12c6bf4
      - fix/dialog-content-footer-fit-be2fbe5
      - fix/weather-icons-smaller-r114-75pct
    paths:
      - 'launcher/**'
      - '.github/workflows/build-weekly-weather-launcher.yml'
  pull_request:
    branches:
      - feature/weather-icons-emotn-inspired-67c7d53
      - feature/unified-settings-ui-7c7345f
      - fix/weather-city-heading-visible-506e839
    paths:
      - 'launcher/**'
      - '.github/workflows/build-weekly-weather-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run launcher unit tests and build debug APK
        run: |
          cd launcher
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Weekly-Weather-Launcher-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete source archive
        run: |
          git archive --format=zip --output=CYTV-Weekly-Weather-Launcher-source.zip HEAD
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Weekly-Weather-Launcher-Source
          path: CYTV-Weekly-Weather-Launcher-source.zip
          if-no-files-found: error
          retention-days: 30
