name: Build CYTV Weekly Weather Launcher
# CI includes the folder app picker layout validation branch.
# Pull-request base branch is enabled for CI.
# Rebuild after the larger app tile and checkbox proportion update.
# Rebuild the weekly weather dialog button lower-position adjustment.

on:
  push:
    branches:
      - fix/weather-city-search-7day
      - fix/folder-grid-fixed-four-columns
      - fix/folder-app-assignment-sync
      - fix/folder-dialog-dpad-from-baseline
      - feature/weather-icons-emotn-inspired-67c7d53
      - feature/unified-settings-ui-7c7345f
      - fix/folder-app-menu-window-anchor-a692da0
      - fix/weather-city-heading-visible-506e839
      - fix/weekly-weather-dialog-button-clipping-ancestors
      - fix/icon-appearance-dialog-layout-be2fbe5
      - fix/icon-appearance-preview-match-desktop-12c6bf4
      - fix/weather-icons-smaller-be2fbe5
      - fix/folder-app-picker-inner-layout-be2fbe5
      - fix/create-folder-dialog-content-layout
      - fix/create-folder-dialog-fixed-size-content-position
      - fix/weekly-weather-dialog-fixed-size-white-actions
      - fix/weather-dialog-viewgroup-clip-methods
      - fix/weekly-weather-dialog-button-clipping-ancestors
      - feature/traditional-chinese-folder-app-lists
      - fix/youtube-pair-dialog-layout-remote-focus
    paths:
      - 'launcher/**'
      - '.github/workflows/build-weekly-weather-launcher.yml'
  pull_request:
    branches:
      - feature/weather-icons-emotn-inspired-67c7d53
      - feature/unified-settings-ui-7c7345f
      - fix/weather-city-heading-visible-506e839
    paths:
      - 'launcher/**'
      - '.github/workflows/build-weekly-weather-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run launcher unit tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Weekly-Weather-Launcher-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete source archive
        run: |
          zip -qr CYTV-Weekly-Weather-Launcher-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-Weekly-Weather-Launcher-source.zip'
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Weekly-Weather-Launcher-Source
          path: CYTV-Weekly-Weather-Launcher-source.zip
          if-no-files-found: error
          retention-days: 30
