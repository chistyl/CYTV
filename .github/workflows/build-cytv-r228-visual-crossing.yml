name: CYTV R228 Visual Crossing Free Seven-Day Weather

on:
  push:
    branches:
      - feat/visual-crossing-free-weather-r228
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r228-visual-crossing.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R228-debug.apk
          zip -qr release/CYTV-R228-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './release/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R228-APK-and-Source
          path: |
            release/CYTV-R228-debug.apk
            release/CYTV-R228-Source.zip
          if-no-files-found: error
          retention-days: 90
