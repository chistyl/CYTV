name: CYTV R130 Activation Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-r130-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R130-Activation-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
