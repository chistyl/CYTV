name: Launcher ATV R132 Universal Password Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - fix/weather-dialog-global-dpad-dispatch-r129
      - feature/first-launch-activation-r130
      - feature/universal-activation-password-r132
      - fix/ethernet-hide-ad-filter-r131
    paths:
      - 'launcher/**'
      - '.github/workflows/build-r130-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ethernet-ad-filter-policy-r133' && 'R133' || (github.event.pull_request.head.ref == 'fix/hide-simplified-traditional-button-r134' && 'R134' || 'R132') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/LauncherATV-${RELEASE_VERSION}-Activation-debug.apk
          zip -r release/LauncherATV-${RELEASE_VERSION}-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LauncherATV-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ethernet-ad-filter-policy-r133' && 'R133' || 'R132' }}-APK-and-Source
          path: |
            release/LauncherATV-*.apk
            release/LauncherATV-*-Source.zip
          if-no-files-found: error
