name: Validate experimental R1 removal (no device release)

on:
  pull_request:
    branches:
      - fix/ethernet-dns-recovery-r4-r98
    paths:
      - 'launcher/**'
      - 'scripts/validate-experimental-r1-removal.py'
      - '.github/workflows/validate-experimental-r1-removal.yml'
  push:
    branches:
      - experiment/remove-toshiba-r1-vpn-guard
    paths:
      - 'launcher/**'
      - 'scripts/validate-experimental-r1-removal.py'
      - '.github/workflows/validate-experimental-r1-removal.yml'

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Validate requested R1 removal
        run: python3 scripts/validate-experimental-r1-removal.py
      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile debug APK (not published)
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
