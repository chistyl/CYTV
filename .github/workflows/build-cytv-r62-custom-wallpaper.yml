name: CYTV R96 Custom Wallpaper Selection Frame Fix

on:
  push:
    branches:
      - feature/custom-wallpaper-gallery-r62
      - fix/custom-wallpaper-gallery-selection-r63
      - fix/wallpaper-source-selector-size-r64
      - fix/custom-wallpaper-grid-fixed-three-columns-r67
      - fix/wallpaper-dialog-grid-width-r68
      - fix/wallpaper-gallery-full-width-r70
      - fix/wallpaper-gallery-measured-grid-r72
      - fix/qr-dialog-restore-folder-style-r73
      - fix/wallpaper-spacing-dpad-focus-r76
      - fix/custom-wallpaper-long-press-r77
      - fix/custom-wallpaper-heading-dpad-focus-r80
      - fix/wallpaper-settings-unified-spacing-r81
      - feature/custom-wallpaper-multi-import-r82
      - fix/qr-wallpaper-dialog-return-r83
      - fix/qr-wallpaper-backdrop-blur-r84
      - fix/qr-upload-description-remove-size-limit-r85
      - fix/wallpaper-file-picker-return-r86
      - fix/wallpaper-bottom-actions-margin-15dp-r87
      - fix/wallpaper-page-bottom-inset-15dp-r88
      - fix/topbar-input-wifi-icon-only-r89
      - fix/wifi-label-retained-r90
      - fix/wifi-label-visible-with-vpn-r91
      - fix/vpn-foreground-startup-crash-r92
      - fix/home-app-hide-refresh-r93
      - fix/folder-rename-dialog-match-category-r96
  pull_request:
    branches:
      - feature/custom-wallpaper-gallery-r62
      - fix/custom-wallpaper-gallery-selection-r63
      - fix/wallpaper-source-selector-size-r64
      - fix/wallpaper-gallery-full-width-r65
      - fix/wallpaper-dialog-grid-width-r68
      - fix/custom-wallpaper-grid-fixed-three-columns-r67
      - fix/wallpaper-gallery-fixed-grid-r70
      - fix/wallpaper-gallery-full-width-r69
      - fix/wallpaper-gallery-measured-grid-r72
      - fix/qr-dialog-restore-folder-style-r73
      - fix/wallpaper-spacing-dpad-focus-r74
      - fix/qr-dialog-backdrop-blur-r75
      - fix/custom-wallpaper-multiselect-delete-r76
      - fix/custom-wallpaper-long-press-r77
      - fix/custom-wallpaper-dpad-long-press-r78
      - fix/wallpaper-default-heading-dpad-focus-r79
      - fix/custom-wallpaper-heading-dpad-focus-r80
      - fix/wallpaper-settings-unified-spacing-r81
      - feature/custom-wallpaper-multi-import-r82
      - fix/qr-wallpaper-dialog-return-r83
      - fix/qr-wallpaper-backdrop-blur-r84
      - fix/qr-upload-description-remove-size-limit-r85
      - fix/wallpaper-file-picker-return-r86
      - fix/wallpaper-bottom-actions-margin-15dp-r87
      - fix/wallpaper-page-bottom-inset-15dp-r89
      - fix/vpn-foreground-startup-crash-r92
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r96-folder-rename-dialog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R96
        uses: actions/checkout@v4
        with:
          ref: fix/folder-rename-dialog-match-category-r96
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R96-debug.apk
          zip -r release/CYTV-R96-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R96-APK-and-Source
          path: |
            release/CYTV-R96-debug.apk
            release/CYTV-R96-source.zip
          if-no-files-found: error
          retention-days: 30
