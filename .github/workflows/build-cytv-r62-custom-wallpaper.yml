name: CYTV R74 Wallpaper Spacing and DPAD Focus

on:
  push:
    branches:
      - feature/custom-wallpaper-gallery-r62
      - fix/custom-wallpaper-gallery-selection-r63
      - fix/wallpaper-source-selector-size-r64
      - fix/custom-wallpaper-grid-fixed-three-columns-r67
      - fix/wallpaper-dialog-grid-width-r68
      - fix/wallpaper-gallery-full-width-r70
      - fix/wallpaper-gallery-measured-grid-r72
      - fix/qr-dialog-restore-folder-style-r73
      - fix/wallpaper-spacing-dpad-focus-r74
  pull_request:
    branches:
      - feature/custom-wallpaper-gallery-r62
      - fix/custom-wallpaper-gallery-selection-r63
      - fix/wallpaper-source-selector-size-r64
      - fix/wallpaper-gallery-full-width-r65
      - fix/wallpaper-dialog-grid-width-r68
      - fix/custom-wallpaper-grid-fixed-three-columns-r67
      - fix/wallpaper-gallery-fixed-grid-r70
      - fix/wallpaper-gallery-full-width-r69
      - fix/wallpaper-gallery-measured-grid-r72
      - fix/qr-dialog-restore-folder-style-r73
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r74-wallpaper-spacing-dpad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R74
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R74-debug.apk
          zip -r release/CYTV-R74-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R74-APK-and-Source
          path: |
            release/CYTV-R74-debug.apk
            release/CYTV-R74-source.zip
          if-no-files-found: error
          retention-days: 30
