name: Build CYTV Three Dialog Scale 90 Cards 88 R1

on:
  push:
    branches:
      - fix/three-dialog-scale-90-cards-88-spacing-r1
      - feature/interface-desktop-settings-menu-r1
      - fix/interface-settings-menu-labels-r1
      - fix/desktop-layout-page-clear-items-r1
      - fix/desktop-layout-title-center-content-vertical-center-r1
      - fix/youtube-video-carousel-pr124-r2
      - fix/youtube-carousel-referer-identity-r3
      - feature/youtube-carousel-vignette-r4
      - fix/youtube-carousel-fullbleed-vignette-r5
      - fix/youtube-carousel-fullscreen-corners-r6
      - fix/youtube-carousel-remove-duplicate-corner-r7
      - fix/youtube-carousel-video-scale-120-r8
      - fix/youtube-carousel-gradle-ci-recovery-r9
      - fix/youtube-carousel-video-scale-120-whole-frame-r11
      - fix/youtube-carousel-video-scale-130-whole-frame-r12
      - fix/youtube-carousel-vignette-inset-15-r13
      - fix/youtube-carousel-video-scale-100-r14
      - fix/youtube-carousel-vignette-top25-others10-r15
      - fix/youtube-carousel-vignette-top-bottom25-sides10-r16
      - feature/youtube-carousel-timing-playback-modes-r17
      - fix/youtube-carousel-shared-timing-setting-r18
      - fix/youtube-carousel-dialog-match-icon-appearance-r19
      - fix/youtube-carousel-dialog-controls-layout-r20
      - fix/youtube-carousel-dialog-remote-focus-r21
      - fix/youtube-carousel-dialog-show-all-rows-r22
      - fix/youtube-carousel-complete-remote-navigation-r23
      - fix/youtube-carousel-url-field-remote-focus-r24
      - fix/youtube-carousel-arrow-remote-actions-remove-borders-r25
    paths:
      - 'launcher/**'
      - '.github/workflows/build-three-dialog-scale-90-cards-88-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dual boot recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle 8.9 distribution
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-8.9
          key: gradle-8.9-bin-linux-x64-v1

      - name: Install Gradle 8.9 from Huawei mirror (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ROOT="${RUNNER_TEMP}/gradle-8.9"
          if [ ! -x "${GRADLE_ROOT}/gradle-8.9/bin/gradle" ]; then
            mkdir -p "${GRADLE_ROOT}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              "https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip" \
              --output "${RUNNER_TEMP}/gradle-8.9-bin.zip"
            echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  ${RUNNER_TEMP}/gradle-8.9-bin.zip" | sha256sum --check
            unzip -q "${RUNNER_TEMP}/gradle-8.9-bin.zip" -d "${GRADLE_ROOT}"
          fi
          echo "${GRADLE_ROOT}/gradle-8.9/bin" >> "${GITHUB_PATH}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run launcher unit tests
        working-directory: launcher
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: launcher
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Three-Dialog-Scale-90-Cards-88-R1-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source archive
        run: zip -qr CYTV-Three-Dialog-Scale-90-Cards-88-R1-Complete-Source.zip . -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' './launcher/app/build/*' './CYTV-Three-Dialog-Scale-90-Cards-88-R1-Complete-Source.zip'

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Three-Dialog-Scale-90-Cards-88-R1-Complete-Source
          path: CYTV-Three-Dialog-Scale-90-Cards-88-R1-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
