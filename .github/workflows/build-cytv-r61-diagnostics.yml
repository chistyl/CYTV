name: CYTV R61 Wallpaper Crash Diagnostics

on:
  push:
    branches:
      - diagnostic/wallpaper-picker-crash-r61
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r61-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R61 diagnostics
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R61-diagnostics-debug.apk
          zip -r release/CYTV-R61-diagnostics-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R61-Diagnostics-APK-and-Source
          path: |
            release/CYTV-R61-diagnostics-debug.apk
            release/CYTV-R61-diagnostics-source.zip
          if-no-files-found: error
          retention-days: 30
