name: Validate launcher icon and TV banner

on:
  pull_request:
    branches:
      - experiment/remove-toshiba-r1-vpn-guard
    paths:
      - 'launcher/app/src/main/res/**'
      - '.github/workflows/validate-icon-banner.yml'
  push:
    branches:
      - feature/replace-app-icon-tv-banner-b3a294e
    paths:
      - 'launcher/app/src/main/res/**'
      - '.github/workflows/validate-icon-banner.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package complete source at this commit
        run: git archive --format=zip --output=cytv-icon-banner-source.zip HEAD
      - name: Upload icon/banner test APK
        uses: actions/upload-artifact@v4
        with:
          name: cytv-icon-banner-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cytv-icon-banner-source
          path: cytv-icon-banner-source.zip
          if-no-files-found: error
          retention-days: 3
