name: CYTV R229 Login Verification Build

on:
  push:
    branches:
      - feat/enable-login-verification-r229
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r229-login-verification.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable R229 login verification
        working-directory: launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/com/gathin/tvhome/MainActivity.java")
          lines = main.read_text(encoding="utf-8").splitlines()
          marker = "        // R156: login/activation verification disabled; open the desktop directly."
          replacement = [
              "        // R229: require offline activation before opening the main desktop.",
              "        if (!ActivationGate.isActivated(this)) {",
              "            startActivity(new android.content.Intent(this, ActivationActivity.class));",
              "            finish();",
              "            return;",
              "        }",
          ]
          if marker in lines:
              i = lines.index(marker)
              lines[i:i+1] = replacement
          elif "        if (!ActivationGate.isActivated(this)) {" not in lines:
              raise SystemExit("R229 MainActivity insertion point not found")
          main.write_text("\n".join(lines) + "\n", encoding="utf-8")

          activity = Path("app/src/main/java/com/gathin/tvhome/ActivationActivity.java")
          lines = activity.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "hint.setText(" in line:
                  lines[i] = '        hint.setText("首次使用前，請輸入啟用驗證碼，驗證成功後即可使用");'
                  break
          else:
              raise SystemExit("ActivationActivity hint line not found")
          activity.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R229-Login-Verification-debug.apk
          zip -qr release/CYTV-R229-Login-Verification-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './release/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R229-Login-Verification-APK-and-Source
          path: |
            release/CYTV-R229-Login-Verification-debug.apk
            release/CYTV-R229-Login-Verification-Source.zip
          if-no-files-found: error
          retention-days: 90

# R229 build workflow: apply activation edits with newline-safe Python writes.
