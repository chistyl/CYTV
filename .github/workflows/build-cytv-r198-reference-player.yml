name: CYTV R217 Media Player Position Build

on:
  push:
    branches:
      - fix/media-player-r198-reference-layout
      - fix/media-player-audio-playback-callback-r210
      - fix/media-player-black-transparent-focus-r211
      - fix/media-player-visible-focus-ring-r212
      - fix/media-player-artwork-display-only-r213
      - fix/interface-layout-bottom-row-align-r214
      - feat/media-thumbnail-launch-source-app-r215
      - feat/media-player-thumbnail-controls-only-r216
      - fix/media-player-position-up-left-r217
      - feat/enable-login-verification-r218
    paths:
      - 'launcher/**'
      - 'patches/CYTV_R215_media_thumbnail_launch_source.patch'
      - 'patches/CYTV_R216_media_player_thumbnail_controls_only.patch'
      - 'patches/CYTV_R217_media_player_position_up_left.patch'
      - 'patches/CYTV_R218_enable_login_verification.patch'
      - '.github/workflows/build-cytv-r198-reference-player.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/media-player-r197-r196-clean-build
      - fix/media-player-black-transparent-focus-r211
      - fix/media-player-visible-focus-ring-r212
      - fix/media-player-artwork-display-only-r213
      - fix/interface-layout-bottom-row-align-r214
      - feat/media-thumbnail-launch-source-app-r215
      - feat/media-player-thumbnail-controls-only-r216
      - fix/media-player-position-up-left-r217
    paths:
      - 'launcher/**'
      - 'patches/CYTV_R215_media_thumbnail_launch_source.patch'
      - 'patches/CYTV_R216_media_player_thumbnail_controls_only.patch'
      - 'patches/CYTV_R217_media_player_position_up_left.patch'
      - '.github/workflows/build-cytv-r198-reference-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply R215 media thumbnail source-app changes
        if: github.head_ref == 'feat/media-thumbnail-launch-source-app-r215' || github.ref == 'refs/heads/feat/media-thumbnail-launch-source-app-r215' || github.head_ref == 'feat/media-player-thumbnail-controls-only-r216' || github.ref == 'refs/heads/feat/media-player-thumbnail-controls-only-r216' || github.head_ref == 'fix/media-player-position-up-left-r217' || github.ref == 'refs/heads/fix/media-player-position-up-left-r217' || github.head_ref == 'feat/enable-login-verification-r218' || github.ref == 'refs/heads/feat/enable-login-verification-r218' || github.head_ref == 'feat/enable-login-verification-r218' || github.ref == 'refs/heads/feat/enable-login-verification-r218' || github.head_ref == 'feat/enable-login-verification-r218' || github.ref == 'refs/heads/feat/enable-login-verification-r218'
        run: patch --no-backup-if-mismatch -p1 < patches/CYTV_R215_media_thumbnail_launch_source.patch
      - name: Apply R216 minimal media player changes
        if: github.head_ref == 'feat/media-player-thumbnail-controls-only-r216' || github.ref == 'refs/heads/feat/media-player-thumbnail-controls-only-r216' || github.head_ref == 'fix/media-player-position-up-left-r217' || github.ref == 'refs/heads/fix/media-player-position-up-left-r217'
        run: patch --no-backup-if-mismatch -p1 < patches/CYTV_R216_media_player_thumbnail_controls_only.patch
      - name: Apply R217 media player position adjustment
        if: github.head_ref == 'fix/media-player-position-up-left-r217' || github.ref == 'refs/heads/fix/media-player-position-up-left-r217'
        run: patch --no-backup-if-mismatch -p1 < patches/CYTV_R217_media_player_position_up_left.patch
      - name: Apply R218 login verification changes
        if: github.head_ref == 'feat/enable-login-verification-r218' || github.ref == 'refs/heads/feat/enable-login-verification-r218'
        run: patch --no-backup-if-mismatch -p1 < patches/CYTV_R218_enable_login_verification.patch
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Package APK and complete source
        run: |
          mkdir -p release
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "feat/enable-login-verification-r218" ]; then
            cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R218-Login-Verification-debug.apk
            zip -qr release/CYTV-R218-Login-Verification-Source.zip . \
              -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \\
                 './launcher/app/build/*' './release/*'
          elif [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "fix/media-player-position-up-left-r217" ]; then
            cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R217-Media-Player-Position-debug.apk
            zip -qr release/CYTV-R217-Media-Player-Position-Source.zip . \
              -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
                 './launcher/app/build/*' './release/*'
          else
            cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R198-R196-Style-Preserved-debug.apk
            zip -qr release/CYTV-R198-R196-Style-Preserved-Source.zip . \
              -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
                 './launcher/app/build/*' './release/*'
          fi
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R218-deliverables
          path: release/*
          if-no-files-found: error
          retention-days: 30
