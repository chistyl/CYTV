name: CYTV R216 Dialog Action Row Compatibility Build

on:
  push:
    branches:
      - fix/media-player-r198-reference-layout
      - fix/media-player-audio-playback-callback-r210
      - fix/media-player-black-transparent-focus-r211
      - fix/media-player-visible-focus-ring-r212
      - fix/media-player-artwork-display-only-r213
      - fix/interface-layout-bottom-row-align-r214
      - fix/dialog-button-safe-layout-r216
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r198-reference-player.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/media-player-r197-r196-clean-build
      - fix/media-player-black-transparent-focus-r211
      - fix/media-player-visible-focus-ring-r212
      - fix/media-player-artwork-display-only-r213
      - fix/interface-layout-bottom-row-align-r214
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r198-reference-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R216-debug.apk
          zip -qr release/CYTV-R216-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './release/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R216
          path: |
            release/CYTV-R216-debug.apk
            release/CYTV-R216-Source.zip
          if-no-files-found: error
          retention-days: 30
