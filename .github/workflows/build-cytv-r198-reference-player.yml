name: CYTV R216 Media Thumbnail Only Build

on:
  push:
    branches:
      - feat/media-thumbnail-only-r216
    paths:
      - 'launcher/**'
      - 'patches/CYTV_R215_media_thumbnail_launch_source.patch'
      - 'patches/CYTV_R216_media_thumbnail_only.patch'
      - '.github/workflows/build-cytv-r198-reference-player.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feat/media-thumbnail-launch-source-app-r215
    paths:
      - 'patches/CYTV_R215_media_thumbnail_launch_source.patch'
      - 'patches/CYTV_R216_media_thumbnail_only.patch'
      - '.github/workflows/build-cytv-r198-reference-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply R215 source-app behavior
        run: patch -p1 < patches/CYTV_R215_media_thumbnail_launch_source.patch
      - name: Apply R216 thumbnail-only layout
        run: patch -p1 < patches/CYTV_R216_media_thumbnail_only.patch
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R216-Media-Thumbnail-Only-debug.apk
          zip -qr release/CYTV-R216-Media-Thumbnail-Only-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './release/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R216-deliverables
          path: release/*
          if-no-files-found: error
          retention-days: 30
