name: CYTV R155 Bright Sky API Validation and Build

on:
  push:
    branches:
      - feature/weather-third-fallback-r155
    paths:
      - '.github/workflows/test-cytv-r155-bright-sky.yml'
      - 'launcher/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/weather-metno-fallback-r154
    paths:
      - '.github/workflows/test-cytv-r155-bright-sky.yml'
      - 'launcher/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bright-sky:
    runs-on: ubuntu-latest
    steps:
      - name: Query Bright Sky forecast for Taoyuan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import urllib.request

          tz = ZoneInfo('Asia/Taipei')
          start = datetime.now(tz).date()
          end = start + timedelta(days=8)
          url = (
              'https://api.brightsky.dev/weather'
              f'?lat=24.99&lon=121.31&date={start.isoformat()}'
              f'&last_date={end.isoformat()}&tz=Asia%2FTaipei&units=dwd'
          )
          req = urllib.request.Request(url, headers={'User-Agent': 'CYTV-R155-personal-weather-test'})
          with urllib.request.urlopen(req, timeout=30) as response:
              import json
              payload = json.loads(response.read().decode('utf-8'))
          records = payload.get('weather')
          assert isinstance(records, list) and records, 'Bright Sky returned no weather records'
          daily = {}
          for item in records:
              stamp = item.get('timestamp')
              temp = item.get('temperature')
              if not stamp or not isinstance(temp, (int, float)):
                  continue
              moment = datetime.fromisoformat(stamp.replace('Z', '+00:00')).astimezone(tz)
              key = moment.date().isoformat()
              bucket = daily.setdefault(key, {'high': temp, 'low': temp, 'count': 0})
              bucket['high'] = max(bucket['high'], temp)
              bucket['low'] = min(bucket['low'], temp)
              bucket['count'] += 1
          usable = [(day, value) for day, value in sorted(daily.items()) if value['count'] > 0]
          assert len(usable) >= 7, f'Bright Sky forecast has only {len(usable)} usable Taiwan-local days'
          print('Bright Sky forecast API schema OK for Taoyuan.')
          print('Sources returned:', len(payload.get('sources', [])))
          print('Forecast days with temperatures:', len(usable))
          print('Validated dates:', usable[0][0], 'through', usable[6][0])
          print('First-day high/low:', usable[0][1]['high'], usable[0][1]['low'])
          PY

  build:
    runs-on: ubuntu-latest
    needs: validate-bright-sky
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R155-debug.apk
          zip -r release/CYTV-R155-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R155-APK-and-Source
          path: |
            release/CYTV-R155-debug.apk
            release/CYTV-R155-Source.zip
          if-no-files-found: error
