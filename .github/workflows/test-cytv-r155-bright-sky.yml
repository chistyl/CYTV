name: CYTV R155 7Timer API Validation and Build

on:
  push:
    branches:
      - feature/weather-third-fallback-r155
    paths:
      - '.github/workflows/test-cytv-r155-bright-sky.yml'
      - 'launcher/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/weather-metno-fallback-r154
    paths:
      - '.github/workflows/test-cytv-r155-bright-sky.yml'
      - 'launcher/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-7timer:
    runs-on: ubuntu-latest
    steps:
      - name: Query 7Timer CIVIL forecast for Taoyuan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import json
          import urllib.request

          tz = ZoneInfo('Asia/Taipei')
          url = 'https://www.7timer.info/bin/api.pl?lon=121.31&lat=24.99&product=civil&output=json'
          req = urllib.request.Request(url, headers={'User-Agent': 'CYTV-R155-weather-validation'})
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status == 200, f'Unexpected HTTP status: {response.status}'
              payload = json.loads(response.read().decode('utf-8'))

          assert isinstance(payload, dict), '7Timer response is not a JSON object'
          assert payload.get('product') == 'civil', f"Unexpected product: {payload.get('product')}"
          series = payload.get('dataseries')
          assert isinstance(series, list) and len(series) >= 20, (
              f'Insufficient forecast records: {len(series) if isinstance(series, list) else "missing"}'
          )

          init = str(payload.get('init', ''))
          try:
              init_utc = datetime.strptime(init, '%Y%m%d%H').replace(tzinfo=timezone.utc)
          except ValueError as exc:
              raise AssertionError(f'Unexpected 7Timer init timestamp: {init!r}') from exc

          daily = {}
          for item in series:
              if not isinstance(item, dict):
                  continue
              temp = item.get('temp2m')
              hour = item.get('timepoint')
              if not isinstance(temp, (int, float)) or not isinstance(hour, (int, float)):
                  continue
              local_day = (init_utc + timedelta(hours=hour)).astimezone(tz).date().isoformat()
              bucket = daily.setdefault(local_day, {'high': temp, 'low': temp, 'samples': 0})
              bucket['high'] = max(bucket['high'], temp)
              bucket['low'] = min(bucket['low'], temp)
              bucket['samples'] += 1

          usable = sorted(daily.items())
          assert len(usable) >= 7, (
              f'7Timer returned only {len(usable)} Taiwan-local days with temperature data'
          )
          first = usable[0][1]
          print('7Timer CIVIL API OK for Taoyuan (24.99, 121.31).')
          print('Forecast records:', len(series))
          print('Usable Taiwan-local forecast days:', len(usable))
          print('Validated first 7 days:', usable[0][0], 'through', usable[6][0])
          print('First available day high/low:', first['high'], first['low'])
          print('Example weather code:', series[0].get('weather'))
          print('Precipitation field:', series[0].get('prec_type'), series[0].get('prec_amount'))
          PY

  build:
    runs-on: ubuntu-latest
    needs: validate-7timer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R155-debug.apk
          zip -r release/CYTV-R155-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R155-APK-and-Source
          path: |
            release/CYTV-R155-debug.apk
            release/CYTV-R155-Source.zip
          if-no-files-found: error
