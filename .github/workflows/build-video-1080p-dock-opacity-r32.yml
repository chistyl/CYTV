name: Build CYTV R32 Standby Network Auto Recovery

on:
  push:
    branches:
      - fix/video-1080p-dock-opacity-70-r32
    paths:
      - 'launcher/**'
      - '.github/workflows/build-video-1080p-dock-opacity-r32.yml'
  pull_request:
    branches:
      - fix/standby-network-auto-recovery-r31
    paths:
      - 'launcher/**'
      - '.github/workflows/build-video-1080p-dock-opacity-r32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R32 isolated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R32-Standby-Network-Auto-Recovery-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source archive
        run: |
          zip -qr CYTV-R32-Standby-Network-Auto-Recovery-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-R32-Standby-Network-Auto-Recovery-source.zip'

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R32-Standby-Network-Auto-Recovery-Complete-Source
          path: CYTV-R32-Standby-Network-Auto-Recovery-source.zip
          if-no-files-found: error
          retention-days: 30
