name: CYTV R119 Wallpaper Picker Parent Fix
# R119 fixes the wallpaper picker duplicate-parent crash while preserving the R118 module switch.

on:
  push:
    branches:
      - fix/wallpaper-picker-double-parent-r119
  pull_request:
    branches:
      - feature/wallpaper-module-enable-r118
      - fix/wallpaper-picker-double-parent-r119
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r119-wallpaper-picker-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R119
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R119-debug.apk
          zip -r release/CYTV-R119-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R119-APK-and-Source
          path: |
            release/CYTV-R119-debug.apk
            release/CYTV-R119-source.zip
          if-no-files-found: error
          retention-days: 30
