name: CYTV R123 Wallpaper Module Cancel Rollback
# R123 clears unsaved wallpaper settings drafts on cancel/dismiss while preserving drafts for the system image picker.

on:
  push:
    branches:
      - fix/wallpaper-module-cancel-rollback-r123
  pull_request:
    branches:
      - fix/wallpaper-enable-button-top-margin-r121
      - fix/wallpaper-disabled-glow-and-picker-cleanup-r122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r123-wallpaper-cancel-rollback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R123
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R123-debug.apk
          zip -r release/CYTV-R123-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R123-APK-and-Source
          path: |
            release/CYTV-R122-debug.apk
            release/CYTV-R122-source.zip
          if-no-files-found: error
          retention-days: 30
