name: CYTV R121 Wallpaper Enable Button Top Margin
# R121 adds 15dp top margin to the module enable button; preserves R120 defaults and R119 picker fix.

on:
  push:
    branches:
      - fix/wallpaper-enable-button-top-margin-r121
  pull_request:
    branches:
      - fix/wallpaper-module-disabled-by-default-r120
      - fix/wallpaper-enable-button-top-margin-r121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r121-wallpaper-enable-margin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R121
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R121-debug.apk
          zip -r release/CYTV-R121-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R121-APK-and-Source
          path: |
            release/CYTV-R120-debug.apk
            release/CYTV-R120-source.zip
          if-no-files-found: error
          retention-days: 30
