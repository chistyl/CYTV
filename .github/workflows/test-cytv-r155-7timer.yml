name: CYTV R155 7Timer API Validation

on:
  push:
    branches:
      - feature/weather-third-fallback-r155
    paths:
      - '.github/workflows/test-cytv-r155-7timer.yml'
      - 'launcher/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/weather-metno-fallback-r154
    paths:
      - '.github/workflows/test-cytv-r155-7timer.yml'
      - 'launcher/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-7timer:
    runs-on: ubuntu-latest
    steps:
      - name: Query 7Timer CIVIL Light for Taoyuan
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            'https://www.7timer.info/bin/api.pl?lon=121.31&lat=24.99&product=civillight&output=json' \
            -o /tmp/7timer.json
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          payload = json.loads(Path('/tmp/7timer.json').read_text(encoding='utf-8'))
          assert payload.get('product') == 'civillight', 'Unexpected product'
          days = payload.get('dataseries')
          assert isinstance(days, list) and len(days) >= 7, 'Fewer than seven forecast days'
          for item in days[:7]:
              date = str(item.get('date', ''))
              datetime.strptime(date, '%Y%m%d')
              weather = item.get('weather')
              assert isinstance(weather, str) and weather, 'Missing weather code'
              temps = item.get('temp2m')
              assert isinstance(temps, dict), 'Missing temp2m object'
              assert isinstance(temps.get('max'), (int, float)), 'Missing daily maximum'
              assert isinstance(temps.get('min'), (int, float)), 'Missing daily minimum'
              assert temps['max'] >= temps['min'], 'Maximum below minimum'
          print('7Timer CIVIL Light schema OK; validated first seven forecast days.')
          print('Provider init:', payload.get('init', 'unknown'))
          print('First forecast date:', days[0]['date'])
          print('Last validated date:', days[6]['date'])
          PY

  build:
    runs-on: ubuntu-latest
    needs: validate-7timer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: ./gradlew testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R155-debug.apk
          zip -r release/CYTV-R155-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R155-APK-and-Source
          path: |
            release/CYTV-R155-debug.apk
            release/CYTV-R155-Source.zip
          if-no-files-found: error
