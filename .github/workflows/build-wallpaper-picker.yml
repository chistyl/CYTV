name: Build CYTV Wallpaper Picker

on:
  push:
    branches:
      - feature/theme-background-on-60-weather-clean
      - fix/wallpaper-dialog-folder-style
    paths:
      - 'launcher/**'
      - '.github/workflows/build-wallpaper-picker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Wallpaper-Picker-Debug-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package complete source
        run: |
          zip -qr CYTV-Wallpaper-Picker-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-Wallpaper-Picker-Source.zip'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Wallpaper-Picker-Complete-Source
          path: CYTV-Wallpaper-Picker-Source.zip
          if-no-files-found: error
          retention-days: 30
