name: Build CYTV YouTube TV Ad Skip

on:
  push:
    branches:
      - feature/youtube-tv-ad-skip-lounge-dbfe6ad
      - fix/youtube-official-ad-skip-retry-c6e224b
    paths:
      - 'launcher/**'
      - '.github/workflows/build-youtube-tv-ad-skip.yml'
  pull_request:
    branches:
      - fix/ethernet-dns-recovery-r4-r98
      - fix/move-global-app-names-setting-85eb84a
      - fix/rename-app-name-toggle-labels-582ba02
      - fix/rename-modify-app-name-label-049bd3c
      - fix/rename-add-to-dock-label-049bd3c
      - fix/rename-folder-to-app-category-7807c63
      - fix/shorten-remove-system-folder-label-53a0454
      - fix/shorten-system-folder-picker-title-8d682ba
    paths:
      - 'launcher/**'
      - '.github/workflows/build-youtube-tv-ad-skip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run unit tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-YouTube-TV-Ad-Skip-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete source archive
        run: |
          zip -qr CYTV-YouTube-TV-Ad-Skip-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-YouTube-TV-Ad-Skip-source.zip'
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-YouTube-TV-Ad-Skip-Complete-Source
          path: CYTV-YouTube-TV-Ad-Skip-source.zip
          if-no-files-found: error
          retention-days: 30
