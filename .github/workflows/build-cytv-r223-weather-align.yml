name: CYTV R223 Weekly Weather Alignment Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-cytv-r223-weather-align.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'fix/weekly-weather-columns-top-align-r223'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R223 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'fix/weekly-weather-columns-top-align-r223' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R223-debug.apk
          zip -r release/CYTV-R223-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R223-APK-and-Source
          path: |
            release/CYTV-R223-debug.apk
            release/CYTV-R223-Source.zip
          if-no-files-found: error
