name: CYTV R109 Sequential Wallpaper and Current Border

on:
  push:
    branches:
      - feature/all-wallpapers-auto-rotation-60s-r107
      - fix/wallpaper-gallery-no-tap-multiselect-r108
      - fix/wallpaper-sequential-current-border-r109
  pull_request:
    branches:
      - fix/custom-wallpaper-selection-persistence-r106
      - feature/all-wallpapers-auto-rotation-60s-r107
      - fix/wallpaper-gallery-no-tap-multiselect-r108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cytv-r109-wallpaper-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R109
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and complete source ZIP
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R109-debug.apk
          zip -r release/CYTV-R109-source.zip . \
            -x '.git/*' '*/.git/*' \
               '*/build/*' '*/.gradle/*' \
               'release/*' '*/local.properties' \
               '*/.idea/*'
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R109-APK-and-Source
          path: |
            release/CYTV-R107-debug.apk
            release/CYTV-R107-source.zip
          if-no-files-found: error
          retention-days: 30
