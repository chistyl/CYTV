name: CYTV R222 Login Verification Build

on:
  push:
    branches:
      - feat/enable-login-verification-r222
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r222-login-verification.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/folder-dialog-fit-without-height-increase-r221
    paths:
      - 'launcher/**'
      - '.github/workflows/build-cytv-r222-login-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run tests and build debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug
      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/*.apk release/CYTV-R222-debug.apk
          zip -qr release/CYTV-R222-Source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './release/*'
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R222
          path: |
            release/CYTV-R222-debug.apk
            release/CYTV-R222-Source.zip
          if-no-files-found: error
          retention-days: 30
