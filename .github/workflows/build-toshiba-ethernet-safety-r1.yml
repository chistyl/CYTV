name: Build CYTV Toshiba Ethernet Safety R1

on:
  push:
    branches:
      - safety/toshiba-android9-ethernet-disable-vpn-r1
    paths:
      - 'launcher/**'
      - '.github/workflows/build-toshiba-ethernet-safety-r1.yml'
  pull_request:
    branches:
      - fix/ethernet-dns-recovery-r4-r98
    paths:
      - 'launcher/**'
      - '.github/workflows/build-toshiba-ethernet-safety-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run launcher unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Toshiba-Ethernet-Safety-R1-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package complete source archive
        run: |
          zip -qr CYTV-Toshiba-Ethernet-Safety-R1-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './launcher/app/build/*' './CYTV-Toshiba-Ethernet-Safety-R1-source.zip'
      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-Toshiba-Ethernet-Safety-R1-Complete-Source
          path: CYTV-Toshiba-Ethernet-Safety-R1-source.zip
          if-no-files-found: error
          retention-days: 30
