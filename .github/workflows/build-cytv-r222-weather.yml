name: CYTV R222 Weather Build Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-cytv-r222-weather.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        default: 'fix/weather-request-generation-cache-r222'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R222 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'fix/weather-request-generation-cache-r222' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        working-directory: launcher
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Package APK and complete source
        run: |
          mkdir -p release
          cp launcher/app/build/outputs/apk/debug/app-debug.apk release/CYTV-R222-debug.apk
          zip -r release/CYTV-R222-Source.zip . -x '.git/*' '*/.git/*' '*/build/*' '*/.gradle/*' 'release/*' '*/local.properties' '*/.idea/*'

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: CYTV-R222-APK-and-Source
          path: |
            release/CYTV-R222-debug.apk
            release/CYTV-R222-Source.zip
          if-no-files-found: error
